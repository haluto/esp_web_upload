<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32-S3 Firmware Flasher</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            max-width: 600px;
            margin: 60px auto;
            padding: 0 20px;
            text-align: center;
            color: #333;
        }
        h1 { font-size: 1.5rem; margin-bottom: 8px; }
        .hint { color: #666; font-size: 0.9rem; margin-bottom: 24px; }
        .controls { margin-bottom: 32px; }
        label { font-size: 0.95rem; color: #444; }
        select {
            margin-top: 8px;
            padding: 8px 12px;
            font-size: 1rem;
            border-radius: 6px;
            border: 1px solid #ccc;
            min-width: 220px;
            background: #fff;
        }
        #status { color: #888; font-size: 0.85rem; margin-top: 8px; min-height: 1.2em; }
    </style>
</head>
<body>
    <h1>ESP32-S3 Firmware Flasher</h1>
    <p class="hint">Use Chrome or Edge and connect the device via USB</p>

    <div class="controls">
        <label for="versionSelect">Select firmware version:</label><br>
        <select id="versionSelect">
            <option value="">Loading...</option>
        </select>
    </div>

    <p id="status"></p>

    <script type="module"
        src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module">
    </script>

    <esp-web-install-button id="installButton"></esp-web-install-button>

    <p class="hint" style="margin-top: 24px;">Do not disconnect the USB cable during flashing</p>

    <script>
        // ===== Constants =====
        const FIRMWARE_DIR = 'firmware';
        const CHIP_FAMILY = 'ESP32-S3';
        const FIRMWARE_DISPLAY_NAME = 'ESP32-S3 Firmware';

        // ===== DOM =====
        const select = document.getElementById('versionSelect');
        const status = document.getElementById('status');
        const button = document.getElementById('installButton');

        // ===== 1. Resolve owner / repo =====
        async function resolveRepoInfo() {
            try {
                const resp = await fetch('config.json', { cache: 'no-store' });
                if (resp.ok) {
                    const cfg = await resp.json();
                    if (cfg.owner && cfg.repo) {
                        return { owner: cfg.owner, repo: cfg.repo };
                    }
                }
            } catch (e) { /* ignore */ }

            const host = location.hostname;
            const pathParts = location.pathname.split('/').filter(Boolean);
            if (host.endsWith('.github.io')) {
                const owner = host.slice(0, -'.github.io'.length);
                const repo = pathParts[0] || `${owner}.github.io`;
                return { owner, repo };
            }
            return null;
        }

        // ===== 2. List firmware files via GitHub Contents API =====
        async function listFirmwareFiles(owner, repo) {
            const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${FIRMWARE_DIR}`;
            const resp = await fetch(apiUrl);
            if (!resp.ok) {
                throw new Error(`GitHub API request failed: HTTP ${resp.status}`);
            }
            const items = await resp.json();
            // Filter .bin files
            return items
                .filter(item => item.type === 'file' && item.name.toLowerCase().endsWith('.bin'))
                .map(item => ({
                    fileName: item.name,
                    version: item.name.replace(/\.bin$/i, ''),
                    downloadUrl: item.download_url
                }));
        }

        // ===== 3. Sort versions (newest first) =====
        function compareVersions(a, b) {
            const pa = a.version.replace(/^v/i, '').split('.').map(n => parseInt(n, 10) || 0);
            const pb = b.version.replace(/^v/i, '').split('.').map(n => parseInt(n, 10) || 0);
            const len = Math.max(pa.length, pb.length);
            for (let i = 0; i < len; i++) {
                const da = pa[i] || 0, db = pb[i] || 0;
                if (da !== db) return db - da;   // descending
            }
            return 0;
        }

        // ===== 4. Build manifest for a selected firmware =====
        function buildManifest(fw) {
            const manifest = {
                name: FIRMWARE_DISPLAY_NAME,
                version: fw.version,
                new_install_prompt_erase: true,
                builds: [{
                    chipFamily: CHIP_FAMILY,
                    parts: [{
                        // Relative path, same-origin, no CORS
                        path: `${FIRMWARE_DIR}/${fw.fileName}`,
                        offset: 0
                    }]
                }]
            };
            const blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
            button.manifest = URL.createObjectURL(blob);
            status.textContent = `Selected: ${fw.version}`;
        }

        // ===== 5. Initialize =====
        async function init() {
            try {
                const info = await resolveRepoInfo();
                if (!info) {
                    status.textContent = 'Unable to determine repository info. Add config.json or deploy on GitHub Pages.';
                    select.innerHTML = '<option value="">Unavailable</option>';
                    return;
                }

                const files = await listFirmwareFiles(info.owner, info.repo);
                if (files.length === 0) {
                    select.innerHTML = '<option value="">No firmware</option>';
                    status.textContent = `No .bin files found in ${FIRMWARE_DIR}/`;
                    return;
                }

                files.sort(compareVersions);

                select.innerHTML = '';
                for (const fw of files) {
                    const opt = document.createElement('option');
                    opt.value = fw.version;
                    opt.textContent = fw.version;
                    opt._fw = fw;
                    select.appendChild(opt);
                }

                buildManifest(files[0]);
            } catch (e) {
                console.error(e);
                select.innerHTML = '<option value="">Load failed</option>';
                status.textContent = 'Failed to load firmware list: ' + e.message;
            }
        }

        select.addEventListener('change', () => {
            const opt = select.options[select.selectedIndex];
            if (opt && opt._fw) {
                buildManifest(opt._fw);
            }
        });

        init();
    </script>
</body>
</html>
